<page-header [action]="phActionTpl">
    <ng-template #phActionTpl>
        <button (click)="add()" nz-button nzType="primary" *abpPermission="'Exam.AnnouncementCategories.Create'">
            {{ 'Exam::NewAnnouncementCategory' | abpLocalization }}
        </button>
    </ng-template>
</page-header>
<nz-card>
    <sf mode="search" [schema]="searchSchema" (formSubmit)="search($event)" (formReset)="reset()"></sf>
    <st #st [data]="categories" [columns]="columns" [loading]="loading" [page]="page" [total]="total"
        [header]="'Exam::DataStart' | abpLocalization" [footer]="'Exam::DataEnd' | abpLocalization"
        responsiveHideHeaderFooter></st>
</nz-card>
