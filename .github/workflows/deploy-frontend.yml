name: Deploy Frontend

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '24.x'

      - name: Build Angular Project
        run: |
          echo "Publishing Admin..."
          cd angular-admin
          yarn install
          npm run build
          cd ..

          echo "Publishing Web..."
          cd angular-web
          yarn install
          npm run build:prod
          cd ..

      - name: Prepare frontend artifact structure
        run: |
          mkdir -p frontend/admin frontend/web
          cp -r angular-admin/dist/exam-admin/browser/* frontend/admin/
          cp -r angular-web/dist/exam-web/browser/* frontend/web/

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: frontend/*
