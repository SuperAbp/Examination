<div class="card">
  <div class="card-header">
    <h5 class="mb-0">{{ '::Menu:MyFavorite' | abpLocalization }}</h5>
  </div>
  <div class="card-body">
    <form (ngSubmit)="search()" class="mb-3">
      <div class="row">
        <div class="col">
          <div class="form-group">
            <input
              type="text"
              class="form-control"
              [(ngModel)]="filters.questionContent"
              name="questionContent"
              [placeholder]="
                '::Placeholder' | abpLocalization: ('::QuestionContent' | abpLocalization)
              "
            />
          </div>
        </div>
        <div class="col">
          <div class="form-group">
            <select class="form-control" [(ngModel)]="filters.questionType" name="questionType">
              <option [value]="null">{{ '::All' | abpLocalization }}</option>
              @for (type of questionTypes; track $index) {
                <option [value]="type.value">
                  {{ type.label | abpLocalization }}
                </option>
              }
            </select>
          </div>
        </div>
        <div class="col">
          <div class="form-group">
            <div>
              <button type="submit" class="btn btn-primary me-2">
                {{ '::Search' | abpLocalization }}
              </button>
              <button type="button" class="btn btn-secondary" (click)="clearFilters()">
                {{ '::Clear' | abpLocalization }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </form>

    <ngx-datatable [rows]="favorites.items" [count]="favorites.totalCount" [list]="list" default>
      <ngx-datatable-column
        [name]="'::QuestionContent' | abpLocalization"
        prop="questionContent"
      ></ngx-datatable-column>
      <ngx-datatable-column [name]="'::QuestionType' | abpLocalization" prop="questionType">
        <ng-template ngx-datatable-cell-template let-row="row">
          {{ '::QuestionType:' + row.questionType | abpLocalization }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column [name]="'::CreationTime' | abpLocalization" prop="creationTime">
        <ng-template ngx-datatable-cell-template let-row="row">
          {{ row.creationTime | date: 'short' }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column
        [name]="'Exam::Actions' | abpLocalization"
        [width]="150"
        [canAutoResize]="false"
        [sortable]="false"
      >
        <ng-template ngx-datatable-cell-template let-row="row">
          <button type="button" class="btn btn-primary" (click)="goDetail(row.id)">
            {{ 'Exam::Detail' | abpLocalization }}
          </button>
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>
  </div>
</div>
