<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-body text-center p-5">
          <!-- 成功图标 -->
          <div class="mb-4">
            <i class="fas fa-check-circle text-success" style="font-size: 5rem"></i>
          </div>

          <!-- 标题 -->
          <h2 class="text-success mb-3">试卷提交成功！</h2>

          <!-- 提示信息 -->
          <div class="mb-4">
            <p class="text-muted fs-5">您的试卷已成功提交，系统正在批改中...</p>
            @if (examName) {
              <p class="text-muted">
                考试名称：<strong>{{ examName }}</strong>
              </p>
            }
          </div>

          <!-- 温馨提示 -->
          <div class="alert alert-info text-start mb-4">
            <h6 class="alert-heading"><i class="fas fa-info-circle"></i> 温馨提示</h6>
            <ul class="mb-0">
              <li>试卷提交后将无法修改答案</li>
              <li>系统将自动批改客观题（单选题、多选题、填空题）</li>
              <li>请等待老师批改主观题（如有）</li>
              <li>您可以在"我的考试"中查看考试成绩和详情</li>
            </ul>
          </div>

          <!-- 操作按钮 -->
          <div class="d-flex gap-3 justify-content-center">
            <button class="btn btn-primary btn-lg" (click)="viewMyExams()">
              <i class="fas fa-list"></i> 查看我的考试
            </button>
            <button class="btn btn-outline-secondary btn-lg" (click)="goToExamList()">
              <i class="fas fa-arrow-left"></i> 返回考试列表
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
